name: iOS unsigned IPA

# Compile l'app mobile pour iPhone sans la signer, et publie le .ipa comme
# artefact. Une app non signée ne s'installe pas seule : elle est destinée à
# être resignée localement (Sideloadly, AltStore) avec un identifiant Apple
# gratuit. Compiler pour iOS exige macOS, d'où l'exécuteur GitHub.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Serveur Ashitaka par défaut dans l'app"
        required: false
        default: "https://utilisa-ten39ih.tail05b9b5.ts.net"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Le Xcode se choisit entre deux bornes : un paquet Swift du projet exige
      # les outils 6.2, tandis qu'expo-modules-jsi ne compile pas avec 6.2.4,
      # dont l'interopérabilité C++ refuse ses annotations. On prend donc le
      # plus ancien Xcode qui atteigne 6.2, et l'inventaire est journalisé pour
      # que le prochain écart se diagnostique sans tâtonner.
      - name: Choisir un Xcode compatible
        run: |
          echo "Xcode disponibles :"
          for app in $(ls -d /Applications/Xcode_*.app | sort -V); do
            # `swift` d'un Xcode non sélectionné ne répond qu'avec DEVELOPER_DIR.
            version=$(DEVELOPER_DIR="$app/Contents/Developer" swift --version 2>&1 \
              | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)
            echo "  $app -> Swift ${version:-inconnu}"
          done
          apps=$(ls -d /Applications/Xcode_*.app | sort -V)
          count=$(echo "$apps" | wc -l | tr -d ' ')
          # L'avant-dernier tombe entre les deux bornes : le défaut de l'image
          # reste sous 6.2, et le plus récent dépasse ce qu'expo-modules-jsi
          # accepte. À défaut d'un second Xcode, on garde le seul disponible.
          if [ "$count" -ge 2 ]; then
            chosen=$(echo "$apps" | tail -2 | head -1)
          else
            chosen=$(echo "$apps" | tail -1)
          fi
          echo "Xcode retenu : $chosen"
          sudo xcode-select -s "$chosen"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Activer pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Générer le projet iOS
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Installer les pods
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Repérer le projet et le schéma
        id: xc
        working-directory: apps/mobile/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace scheme=$scheme"

      # CODE_SIGNING_ALLOWED=NO produit un .app non signé : c'est tout l'objet
      # de ce workflow, et la seule façon de compiler sans compte payant.
      - name: Compiler sans signature
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      # Un .ipa n'est qu'une archive zip contenant un dossier Payload.
      - name: Empaqueter en .ipa
        working-directory: apps/mobile/ios
        run: |
          app=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "app: $app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry Ashitaka-unsigned.ipa Payload
          ls -lh Ashitaka-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ashitaka-unsigned-ipa
          path: apps/mobile/ios/Ashitaka-unsigned.ipa
          if-no-files-found: error
